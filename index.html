<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditor de Contratos</title>
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:'Georgia',serif;background:#f6f3ee;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .brand{color:#8a4a2f;}
  .bg-brand{background:#8a4a2f;}
  .bg-brand:hover{background:#733d26;}
  .card{background:#fffdfa;border:1px solid #e7e0d4;}
  .chat-bubble-user{background:#8a4a2f;color:#fff;}
  .chat-bubble-ai{background:#efe9dd;color:#3a332a;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:#d8cfbe;border-radius:4px;}
</style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center text-gray-800">

<div class="w-full max-w-md mt-4">

  <div class="mb-5 text-center">
    <h1 class="text-2xl font-bold brand tracking-tight">Auditor de Contratos</h1>
    <p class="text-xs text-gray-500 mono mt-1">Análise com IA real · 100% gratuito</p>
  </div>

  <!-- ANÁLISE -->
  <div class="card rounded-2xl p-5 shadow-sm">
    <div class="mb-3">
      <label class="block text-xs font-semibold text-gray-600 mb-1">Sua profissão</label>
      <input type="text" id="profissao" placeholder="Ex: Designer, Desenvolvedor..."
        class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#8a4a2f]">
    </div>
    <div class="mb-4">
      <label class="block text-xs font-semibold text-gray-600 mb-1">Cole o contrato</label>
      <textarea id="textoContrato" rows="7" placeholder="Cole o texto do contrato aqui..."
        class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#8a4a2f]"></textarea>
    </div>
    <button onclick="analisarContrato()" id="btnAnalisar"
      class="w-full bg-brand text-white font-semibold py-3 rounded-lg text-sm transition">
      Analisar com IA
    </button>

    <div id="resultado" class="hidden mt-5 border-t border-gray-200 pt-4">
      <h2 class="font-bold text-sm mb-2 text-gray-700">Resultado da análise</h2>
      <div id="conteudoResultado" class="text-sm leading-relaxed whitespace-pre-wrap"></div>
    </div>
  </div>

  <!-- CHAT LIVRE -->
  <div class="card rounded-2xl p-5 shadow-sm mt-4">
    <h2 class="font-bold text-sm mb-1 text-gray-700">Tire qualquer dúvida</h2>
    <p class="text-xs text-gray-500 mb-3">Pergunte sobre o contrato ou qualquer outro assunto.</p>

    <div id="chatBox" class="space-y-2 mb-3 max-h-72 overflow-y-auto pr-1"></div>

    <div class="flex gap-2">
      <input type="text" id="chatInput" placeholder="Digite sua pergunta..."
        class="flex-1 border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#8a4a2f]"
        onkeydown="if(event.key==='Enter')enviarPergunta()">
      <button onclick="enviarPergunta()"
        class="bg-brand text-white font-semibold px-4 rounded-lg text-sm">Enviar</button>
    </div>
  </div>

  <p class="text-[10px] text-gray-400 text-center mt-4 mono">
    Este app não substitui aconselhamento jurídico profissional.
  </p>
</div>

<script>
function addBubble(texto, autor){
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = autor === 'user'
    ? 'chat-bubble-user rounded-xl rounded-br-sm px-3 py-2 text-sm ml-8'
    : 'chat-bubble-ai rounded-xl rounded-bl-sm px-3 py-2 text-sm mr-8';
  div.style.whiteSpace = 'pre-wrap';
  div.textContent = texto;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

async function analisarContrato(){
  const profissao = document.getElementById('profissao').value.trim();
  const contrato = document.getElementById('textoContrato').value.trim();
  const resultadoDiv = document.getElementById('resultado');
  const conteudo = document.getElementById('conteudoResultado');
  const btn = document.getElementById('btnAnalisar');

  if(!profissao || !contrato){
    alert('Preencha a profissão e cole o contrato.');
    return;
  }

  resultadoDiv.classList.remove('hidden');
  conteudo.textContent = 'Analisando com IA...';
  btn.disabled = true;
  btn.textContent = 'Analisando...';

  const prompt = `Você é um assistente jurídico que ajuda profissionais autônomos (freelancers) a entender contratos antes de assinar. NÃO é advogado e deve deixar isso claro.

Profissão de quem vai assinar: ${profissao}

Analise o contrato abaixo e responda em português, de forma direta e organizada, com:
1. Nível de risco geral (Baixo, Médio ou Alto) e por quê.
2. Lista das cláusulas problemáticas ou que merecem atenção (exclusividade sem remuneração, cessão total de direitos autorais, prazos de pagamento longos, multas desproporcionais, rescisão unilateral, etc.), explicando cada uma em 1-2 frases simples.
3. Sugestões práticas do que negociar antes de assinar.
4. Um lembrete de que isso não substitui um advogado.

Contrato:
"""
${contrato}
"""`;

  try{
    const resposta = await puter.ai.chat(prompt);
    conteudo.textContent = typeof resposta === 'string' ? resposta : resposta.message.content;
  }catch(err){
    conteudo.textContent = 'Não foi possível concluir a análise agora. Tente novamente em instantes.';
    console.error(err);
  }finally{
    btn.disabled = false;
    btn.textContent = 'Analisar com IA';
  }
}

async function enviarPergunta(){
  const input = document.getElementById('chatInput');
  const pergunta = input.value.trim();
  if(!pergunta) return;
  input.value = '';
  addBubble(pergunta, 'user');

  const aiBubble = addBubble('Pensando...', 'ai');

  const contrato = document.getElementById('textoContrato').value.trim();
  const contexto = contrato
    ? `Contexto: o usuário está analisando o seguinte contrato:\n"""${contrato}"""\n\n`
    : '';

  try{
    const resposta = await puter.ai.chat(contexto + 'Pergunta do usuário: ' + pergunta + '\n\nResponda em português, de forma clara e objetiva.');
    aiBubble.textContent = typeof resposta === 'string' ? resposta : resposta.message.content;
  }catch(err){
    aiBubble.textContent = 'Não consegui responder agora. Tente de novo.';
    console.error(err);
  }
}
</script>
</body>
</html>
